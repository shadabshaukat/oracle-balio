[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "balio-benchmark"
version = "0.2.0"
description = "Balanced Logical and physical I/O for Oracle"
requires-python = ">=3.10,<3.15"
dependencies = ["oracledb==3.4.2"]

[project.scripts]
balio = "balio.cli:main"

[tool.setuptools.packages.find]
include = ["balio*"]

[tool.setuptools.package-data]
balio = ["sql/*.sql", "platforms.json"]
